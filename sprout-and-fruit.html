<title>Sprout and Fruit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f1ea;--panel:#ffffff;--fg:#1f1830;--dim:#6b6480;--line:#ddd6e6;--accent:#2f9e57;--accent-fg:#ffffff;--chip:#ece7f3;--ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--hand:'Caveat Brush','Segoe Print','Comic Sans MS',cursive}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140f20;--panel:#1d1630;--fg:#f2ecdf;--dim:#a79ec2;--line:#352c4d;--accent:#8bd96a;--accent-fg:#14101f;--chip:#2a2140;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#140f20;--panel:#1d1630;--fg:#f2ecdf;--dim:#a79ec2;--line:#352c4d;--accent:#8bd96a;--accent-fg:#14101f;--chip:#2a2140;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;padding-inline:16px;padding-block:20px}
.page{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--hand);font-weight:400;font-size:34px;margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--dim);font-size:14px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
#player{position:relative;background:#1f1830;border-radius:12px;overflow:hidden;aspect-ratio:16/9;width:100%;max-width:100%;user-select:none;-webkit-user-select:none}
#player:fullscreen{border-radius:0;aspect-ratio:auto;height:100%}
#player:fullscreen canvas{object-fit:contain}
canvas{width:100%;height:100%;display:block;background:#1f1830}
#cap{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);max-width:86%;background:rgba(20,15,32,.78);color:#f2ecdf;padding:6px 14px;border-radius:6px;font-size:16px;text-align:center;pointer-events:none;transition:opacity .25s}
#cap:empty{display:none}
#splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,15,32,.5);cursor:pointer;color:#f2ecdf}
#splash .btn{width:88px;height:88px;border-radius:50%;background:#8bd96a;display:flex;align-items:center;justify-content:center}
#splash .btn i{display:block;border-left:28px solid #1f1830;border-top:17px solid transparent;border-bottom:17px solid transparent;margin-left:8px}
#splash .lb{font-size:15px;opacity:.9}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#1f1830;color:#a79ec2}
#ctl{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(14,10,24,.88));display:flex;flex-direction:column;gap:6px;transition:opacity .25s;color:#f2ecdf}
#player.idle #ctl,#player.idle #cap{opacity:0}
#player.idle{cursor:none}
#sb{position:relative;height:18px;display:flex;align-items:center;cursor:pointer;touch-action:none}
#sb .tr{position:relative;width:100%;height:5px;background:rgba(255,255,255,.25);border-radius:3px;transition:height .12s}
#sb:hover .tr,#sb.drag .tr{height:8px}
#sb .fl{position:absolute;left:0;top:0;bottom:0;background:#8bd96a;border-radius:3px;width:0}
#sb .th{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#f2ecdf;left:0}
#sb .tk{position:absolute;top:-1px;bottom:-1px;width:2px;background:rgba(20,15,32,.9)}
#tip{position:absolute;bottom:26px;transform:translateX(-50%);background:rgba(20,15,32,.92);color:#f2ecdf;padding:3px 8px;border-radius:4px;font-size:12px;white-space:nowrap;display:none;pointer-events:none}
#sb:hover #tip,#sb.drag #tip{display:block}
.row{display:flex;align-items:center;gap:6px}
.row .sp{flex:1}
.ib{background:none;border:0;color:#f2ecdf;width:38px;height:38px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font:inherit}
.ib:hover{background:rgba(255,255,255,.14)}
.ib:focus-visible,.chap:focus-visible,.seg button:focus-visible{outline:2px solid #8bd96a;outline-offset:1px}
.ib.off svg .x{display:block}.ib svg .x{display:none}
.ib svg{width:22px;height:22px;fill:#f2ecdf;stroke:#f2ecdf}
.ib .lbl{font-size:13px;font-weight:600;padding:0 4px;min-width:38px}
#time{font-size:13px;font-variant-numeric:tabular-nums;margin-left:4px;white-space:nowrap}
#vol{width:70px;accent-color:#8bd96a}
@media (max-width:560px){#vol{display:none}#time{font-size:12px}.hm{display:none}}
aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
aside h2{margin:2px 4px 4px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
#chs{display:flex;flex-direction:column;gap:2px}
@media (max-width:900px){#chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
.chap{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;background:none;border:0;color:var(--fg);font:inherit;padding:8px;border-radius:8px;cursor:pointer;position:relative;overflow:hidden}
.chap:hover{background:var(--chip)}
.chap.cur{background:var(--chip)}
.chap .n{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--dim)}
.chap.cur .n{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.chap .t{font-weight:500;line-height:1.2}
.chap .m{display:block;color:var(--dim);font-size:12px;font-weight:400;margin-top:2px}
.chap .d{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.chap .pg{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);width:0}
.set{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.set label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.seg{display:flex;gap:2px;background:var(--chip);border-radius:8px;padding:2px}
.seg button{background:none;border:0;color:var(--fg);font:inherit;font-size:13px;padding:4px 9px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--panel);box-shadow:0 0 0 1px var(--line);font-weight:600}
.keys{color:var(--dim);font-size:12px;line-height:1.6;margin:4px 4px 0}
kbd{font-family:inherit;background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px}
footer{color:var(--dim);font-size:12px}
</style>
<div class="page">
<header><h1>Sprout and Fruit</h1><span class="sub">A Digital Media MS in 22 months, animated</span></header>
<div class="layout">
<div id="player" tabindex="0" aria-label="Animation player">
<canvas id="cv"></canvas>
<div id="cap" aria-live="polite"></div>
<div id="load">Loading drawings</div>
<div id="splash" hidden><div class="btn"><i></i></div><div class="lb">Play</div></div>
<div id="ctl">
<div id="sb" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" tabindex="0"><div class="tr"><div class="fl"></div><div class="th"></div></div><div id="tip"></div></div>
<div class="row">
<button class="ib" id="bPlay" aria-label="Play"><svg viewBox="0 0 24 24"><path id="pPlay" d="M7 4l13 8-13 8z"/></svg></button>
<button class="ib" id="bPrev" aria-label="Previous chapter"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg></button>
<button class="ib" id="bNext" aria-label="Next chapter"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM4 5l10.5 7L4 19z"/></svg></button>
<button class="ib" id="bSnd" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z" stroke="none"/><path class="w" d="M15 9a4 4 0 010 6M17.5 6.5a8 8 0 010 11" fill="none" stroke-width="2" stroke-linecap="round"/><path class="x" d="M3 3l18 18" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg></button>
<input id="vol" type="range" min="0" max="100" value="70" aria-label="Volume">
<span id="time">0:00 / 0:00</span>
<span class="sp"></span>
<button class="ib" id="bCC" aria-label="Captions"><span class="lbl">CC</span></button>
<button class="ib" id="bSpd" aria-label="Speed"><span class="lbl">1x</span></button>
<button class="ib" id="bFs" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div></div></div>
<aside>
<h2>Chapters</h2><div id="chs"></div>
<div class="set">
<label>Music<span class="seg" id="sgMusic"><button data-v="1" class="on">On</button><button data-v="0">Off</button></span></label>
<label>Sound effects<span class="seg" id="sgSfx"><button data-v="1" class="on">On</button><button data-v="0">Off</button></span></label>
<label>Quality<span class="seg" id="sgQ"><button data-v="1">Fast</button><button data-v="1.5" class="on">Sharp</button></span></label>
<div class="keys hm"><kbd>Space</kbd> play &nbsp;<kbd>&larr;</kbd><kbd>&rarr;</kbd> 5 s &nbsp;<kbd>[</kbd><kbd>]</kbd> chapter &nbsp;<kbd>M</kbd> mute &nbsp;<kbd>C</kbd> captions &nbsp;<kbd>F</kbd> fullscreen</div>
</div></aside>
</div>
<footer>Drawn live in the browser at 24 frames per second. Each scene is a multiplane camera shot with line boil.</footer>
</div>
<script>
// ===== ENGINE: line boil, easing, painterly helpers =====
const W = 1280, H = 720, FPS = 24;
let jc = 0, jseed = 1;
function rnd(n) { const x = Math.sin(n * 127.1 + jseed * 311.7) * 43758.5453; return x - Math.floor(x); }
function jit(a) { jc++; return (rnd(jc) * 2 - 1) * a; }
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const INK = '#1f1830';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function hx(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
function mix(a, b, t) { const A = hx(a), B = hx(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(t, 0, 1)))).join(',') + ')'; }

const E = {
  lin: t => t,
  in: t => t * t * t,
  out: t => 1 - Math.pow(1 - t, 3),
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  hold: t => 0,
  back: t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  spring: t => 1 - Math.exp(-6 * t) * Math.cos(14 * t),
  snap: t => t < .12 ? 0 : E.out((t - .12) / .88)
};
// K(t, [[time,value,easeOfSegment], ...])
function K(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t < b[0]) { const u = (t - a[0]) / (b[0] - a[0]); return lerp(a[1], b[1], E[a[2] || 'io'](u)); }
  }
  return keys[keys.length - 1][1];
}
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

function mkCanvas(w, h) {
  if (typeof document !== 'undefined') { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  return NODE_CANVAS.createCanvas(w, h);
}

// ----- hand line primitives (jittered per boil frame) -----
function spath(c, pts, closed, ox, oy) {
  const n = pts.length; c.beginPath(); c.moveTo(pts[0][0] + ox, pts[0][1] + oy);
  const m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const p0 = pts[closed ? (i - 1 + n) % n : Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[closed ? (i + 1) % n : i + 1], p3 = pts[closed ? (i + 2) % n : Math.min(i + 2, n - 1)];
    c.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6 + ox, p1[1] + (p2[1] - p0[1]) / 6 + oy, p2[0] - (p3[0] - p1[0]) / 6 + ox, p2[1] - (p3[1] - p1[1]) / 6 + oy, p2[0] + ox, p2[1] + oy);
  }
  if (closed) c.closePath();
}
function lpath(c, pts, closed, ox, oy) {
  c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0] + ox, p[1] + oy) : c.moveTo(p[0] + ox, p[1] + oy)); if (closed) c.closePath();
}
function J(pts, a) { return pts.map(p => [p[0] + jit(a), p[1] + jit(a)]); }
function shape(c, pts, o) {
  o = o || {};
  const cl = !o.open, jt = o.j === undefined ? 1 : o.j, P = jt ? J(pts, jt) : pts, fp = o.sharp ? lpath : spath;
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (o.fill) { c.fillStyle = o.fill; fp(c, P, cl, o.ox === undefined ? 1.6 : o.ox, o.oy === undefined ? 1.2 : o.oy); c.fill(); }
  if (o.stroke !== null) { c.strokeStyle = o.stroke || INK; c.lineWidth = o.lw || 3; fp(c, P, cl, 0, 0); c.stroke(); }
}
function ell(c, x, y, rx, ry, o, rot) {
  o = o || {}; const n = o.n || 12, r = rot || 0, cs = Math.cos(r), sn = Math.sin(r), pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, px = Math.cos(a) * rx, py = Math.sin(a) * ry; pts.push([x + px * cs - py * sn, y + px * sn + py * cs]); }
  shape(c, pts, o);
}
function rect(c, x, y, w, h, o) { shape(c, [[x, y], [x + w, y], [x + w, y + h], [x, y + h]], Object.assign({ sharp: true }, o || {})); }
function ln(c, pts, lw, col) { shape(c, pts, { open: true, fill: null, stroke: col || INK, lw: lw || 3 }); }
function limb(c, x1, y1, x2, y2, w, col, bend) {
  const b = bend || 0, mx = (x1 + x2) / 2 - (y2 - y1) * b / 60, my = (y1 + y2) / 2 + (x2 - x1) * b / 60;
  c.lineCap = 'round';
  [[w + 5, INK], [w, col]].forEach(p => { c.strokeStyle = p[1]; c.lineWidth = p[0]; c.beginPath(); c.moveTo(x1, y1); c.quadraticCurveTo(mx, my, x2, y2); c.stroke(); });
}
function txt(c, s, x, y, size, col, align, font) {
  c.font = size + 'px ' + (font || FONT_DISPLAY); c.fillStyle = col || INK; c.textAlign = align || 'center'; c.textBaseline = 'middle'; c.fillText(s, x, y);
}
const FONT_DISPLAY = "'Caveat Brush','Segoe Print','Comic Sans MS',cursive";
const FONT_BODY = "'Patrick Hand','Segoe Print','Comic Sans MS',cursive";

// ----- painterly pre-render helpers (no boil) -----
function sky(c, w, h, stops) {
  const g = c.createLinearGradient(0, 0, 0, h); stops.forEach(s => g.addColorStop(s[0], s[1])); c.fillStyle = g; c.fillRect(0, -140, w, h + 280);
}
function grain(c, r, x, y, w, h, col, n, len, alpha) {
  c.strokeStyle = col; c.globalAlpha = alpha || .15; c.lineWidth = 1.3;
  for (let i = 0; i < n; i++) { const px = x + r() * w, py = y + r() * h; c.beginPath(); c.moveTo(px, py); c.lineTo(px + len * (r() - .3), py + len * (r() - .5) * .35); c.stroke(); }
  c.globalAlpha = 1;
}
function wash(c, r, x, y, w, h, col, a) {
  c.globalAlpha = a; c.fillStyle = col;
  for (let i = 0; i < 5; i++) c.fillRect(x + r() * 10, y + r() * 10, w - r() * 20, h - r() * 20);
  c.globalAlpha = 1;
}
function skyline(c, r, w, base, hmin, hmax, wmin, wmax, col, win, gap) {
  let x = -20;
  while (x < w) {
    const bw = wmin + r() * (wmax - wmin), bh = hmin + r() * (hmax - hmin);
    c.fillStyle = col; c.fillRect(x, base - bh, bw, bh + 500);
    if (r() < .25) c.fillRect(x + bw * .45, base - bh - 26, 4, 28);
    if (win) { c.fillStyle = win; for (let yy = base - bh + 12; yy < base - 10; yy += 16) for (let xx = x + 7; xx < x + bw - 9; xx += 13) if (r() < .33) c.fillRect(xx, yy, 6, 8); }
    x += bw + (gap || 0) + r() * 6;
  }
}
function treeP(c, r, x, base, s, trunk, leaf, leaf2) {
  c.fillStyle = trunk; c.fillRect(x - 6 * s, base - 90 * s, 12 * s, 92 * s);
  for (let i = 0; i < 7; i++) {
    c.fillStyle = i % 2 ? leaf : leaf2;
    c.beginPath(); c.arc(x + (r() - .5) * 70 * s, base - (100 + r() * 70) * s, (28 + r() * 22) * s, 0, 7); c.fill();
  }
}
function paper(c, x, y, rot, s, col) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
  rect(c, -16, -20, 32, 40, { fill: col || '#fbfaf3', lw: 2.2, j: .5 });
  for (let i = 0; i < 4; i++) { c.strokeStyle = '#8a8fa0'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(-10, -10 + i * 8); c.lineTo(10 - (i == 3 ? 8 : 0), -10 + i * 8); c.stroke(); }
  c.restore();
}
function checkMark(c, x, y, s, col, p) { // drawn tick, p = 0..1 draw-on progress
  c.save(); c.translate(x, y); c.scale(s, s); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = col || '#2f9e57'; c.lineWidth = 9;
  const a = [-22, 0], b = [-6, 18], d = [24, -20];
  c.beginPath(); c.moveTo(a[0], a[1]);
  if (p < .4) { const u = p / .4; c.lineTo(lerp(a[0], b[0], u), lerp(a[1], b[1], u)); }
  else { c.lineTo(b[0], b[1]); const u = (p - .4) / .6; c.lineTo(lerp(b[0], d[0], u), lerp(b[1], d[1], u)); }
  c.stroke(); c.restore();
}
function puff(c, x, y, t, s) { // dust puff, t 0..1
  if (t <= 0 || t >= 1) return; const a = 1 - t; c.globalAlpha = a * .8;
  for (let i = -1; i <= 1; i++) ell(c, x + i * (18 + 40 * t) * s, y - 8 - 18 * t * (i == 0 ? 1.4 : 1), (14 + 16 * t) * s, (11 + 12 * t) * s, { fill: '#efe8dc', lw: 2, j: .8 });
  c.globalAlpha = 1;
}

// ripening colour: green -> gold -> magenta -> purple (avoids the muddy grey of a straight green/purple mix)
const RIPE_STOPS = [[0, '#7ccb5c'], [.3, '#b6d055'], [.55, '#d9a04a'], [.78, '#b64f9a'], [1, '#7a3fa8']];
function ripeCol(r, dark) {
  r = clamp(r, 0, 1); let i = 0; while (i < RIPE_STOPS.length - 2 && r > RIPE_STOPS[i + 1][0]) i++;
  const a = RIPE_STOPS[i], b = RIPE_STOPS[i + 1], c = mix(a[1], b[1], (r - a[0]) / (b[0] - a[0]));
  if (!dark) return c; const m = c.match(/\d+/g).map(Number); return 'rgb(' + m.map(v => Math.round(v * .68)).join(',') + ')';
}
// ===== CHARACTERS: Sprout (ripens into Fruit), person, monkey =====
const GRAPES = [[-26, -48], [0, -40], [26, -48], [-35, -66], [35, -66], [-13, -50], [13, -50], [-38, -86], [38, -86], [0, -30]];

function sprout(c, s) {
  const ripe = s.ripe || 0, bob = s.bob || 0, sc = s.scale || 1, sx = (s.sx || 1) * sc, sy = (s.sy || 1) * sc;
  c.save(); c.translate(s.x, s.y);
  c.globalAlpha = .2 * (s.shadowA === undefined ? 1 : s.shadowA); ell(c, 0, 3, 38 * sx, 9, { fill: '#000', stroke: null, j: 0 }); c.globalAlpha = 1;
  c.scale(s.flip || 1, 1); c.rotate(s.lean || 0); c.scale(sx, sy);
  const col = ripeCol(ripe), dark = ripeCol(ripe, true), grape = mix('#9a5ed0', '#7a3fa8', .4);
  // legs
  const st = s.step, moving = st !== undefined, la = moving ? Math.sin(st) * 15 : 0, l1 = moving ? Math.max(0, Math.cos(st)) * 13 : 0, l2 = moving ? Math.max(0, -Math.cos(st)) * 13 : 0;
  const k = s.knee || 0;
  limb(c, -12, -46 + bob, -14 + la, -2 - l1 - k, 9, dark, 0); limb(c, 12, -46 + bob, 14 - la, -2 - l2 - k, 9, dark, 0);

  const SPEEDS = [.5, 1, 1.5, 2];
  let T = 0, playing = false, last = 0, lastFrame = -1, lastT = 0, speed = 1, ccOn = true, ac = null, master = null, musicOn = true, sfxOn = true, muted = false, volume = .7, drag = false, idleTimer = 0, ready = false, scale = 1.5;
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const dpr = () => Math.min(window.devicePixelRatio || 1, scale);
  function sizeCanvas() { const d = dpr(); cv.width = Math.round(W * d); cv.height = Math.round(H * d); lastFrame = -1; if (ready) draw(); }

  // chapters list
  function monthLabel(m) { return MN[(7 + Math.floor(clamp(m, 0, 21.99))) % 12] + ' Y' + (m < 12 ? 1 : 2); }
  const chBtns = SCENES.map((s, i) => {
    const b = document.createElement('button'); b.className = 'chap';
    const rng = s.mo ? (monthLabel(s.mo(0)) + ' to ' + monthLabel(s.mo(s.dur - .01))) : (i === 0 ? 'Opening' : 'Epilogue');
    b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="t">' + NAMES[i] + '<span class="m">' + rng + '</span></span><span class="d">' + fmt(s.dur) + '</span><span class="pg"></span>';
    b.onclick = () => { seek(s.start + (i ? .9 : 0)); setPlaying(true); };
    chs.appendChild(b); return b;
  });
  SCENES.forEach((s, i) => { if (!i) return; const k = document.createElement('div'); k.className = 'tk'; k.style.left = (s.start / TL.total * 100) + '%'; sb.querySelector('.tr').appendChild(k); });

  let curScene = -1;
  function draw() {
    const f = Math.floor(T * FPS); if (f === lastFrame) return; lastFrame = f;
    let i = 0; try { i = renderAt(bx, f / FPS); } catch (e) { console.error(e); }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bufc, 0, 0, cv.width, cv.height);
    const p = T / TL.total * 100;
    if (!drag) { fl.style.width = p + '%'; th.style.left = p + '%'; }
    sb.setAttribute('aria-valuenow', Math.round(p));
    timeEl.textContent = fmt(T) + ' / ' + fmt(TL.total);
    if (i !== curScene) { if (chBtns[curScene]) { chBtns[curScene].classList.remove('cur'); chBtns[curScene].lastChild.style.width = '0'; } curScene = i; chBtns[i].classList.add('cur'); cap.textContent = ccOn ? CAPS[i] : ''; if (!ccOn) cap.textContent = ''; }
    chBtns[i].lastChild.style.width = ((T - SCENES[i].start) / SCENES[i].dur * 100) + '%';
  }
  function prebuild() { const i = sceneAt(T), n = SCENES[i + 1]; if (n && n.planes && !n._planes && SCENES[i].start + SCENES[i].dur - T < 2.5) buildScene(n); }
  function setPlaying(p) {
    if (!ready) return;
    if (p && T >= TL.total - .05) seek(0);
    playing = p; last = performance.now(); splash.hidden = p || T > .01;
    pPlay.setAttribute('d', p ? 'M6 4h4v16H6zM14 4h4v16h-4z' : 'M7 4l13 8-13 8z'); bPlay.setAttribute('aria-label', p ? 'Pause' : 'Play');
    if (p) ensureAudio(); poke();
  }
  function seek(t) { T = clamp(t, 0, TL.total - .001); lastT = T; lastFrame = -1; if (ready) draw(); poke(); }
  function loop(now) {
    requestAnimationFrame(loop);
    if (playing) {
      const dt = Math.min(.1, (now - last) / 1000) * speed; last = now; T += dt;
      if (T >= TL.total - .02) { T = TL.total - .02; playing = false; pPlay.setAttribute('d', 'M7 4l13 8-13 8z'); player.classList.remove('idle'); }
      if (ac && T - lastT < .4) audioStep(lastT, T); lastT = T;
      prebuild();
    } else last = now;
    draw();
  }
  // ----- audio -----
  function ensureAudio() {
    try { if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.connect(ac.destination); applyVol(); } if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; }
  }
  function applyVol() { if (master) master.gain.value = muted ? 0 : volume; bSnd.classList.toggle('off', muted || volume === 0); }
  function tone(f0, f1, dur, type, v, delay) {
    const t0 = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur); o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .02);
  }
  function sfx(n) {
    if (n === 'pop') tone(300, 700, .12, 'sine', .14); else if (n === 'thud') tone(120, 40, .25, 'sine', .25); else if (n === 'boing') tone(200, 520, .3, 'triangle', .14);
    else if (n === 'honk') { tone(260, 250, .35, 'sawtooth', .07); tone(330, 320, .35, 'sawtooth', .05); }
    else if (n === 'chime') { tone(784, 784, .5, 'sine', .1); tone(1175, 1175, .6, 'sine', .08, .12); }
    else if (n === 'stamp') tone(90, 35, .3, 'square', .16); else if (n === 'whoosh') tone(1200, 200, .35, 'sawtooth', .04); else if (n === 'tick') tone(1400, 1400, .04, 'square', .05);
  }
  const SC5 = [0, 2, 4, 7, 9];
  function note(b, delay) {
    const k = (b * 3 + Math.floor(b / 8) * 2) % 10, f = 261.63 * Math.pow(2, (SC5[k % 5] + 12 * Math.floor(k / 5)) / 12), v = .035 * (b % 4 === 0 ? 1.4 : 1);
    tone(f, f, .45, 'sine', v, delay); tone(f * 2, f * 2, .3, 'sine', v * .3, delay);
  }
  function audioStep(a, b) {
    if (sfxOn) cuesBetween(a, b).forEach(sfx);
    if (musicOn) for (let k = Math.floor(a / .5) + 1; k <= Math.floor(b / .5); k++) note(k, Math.max(0, k * .5 - b));
  }
  // ----- idle hide, seek bar -----
  function poke() { player.classList.remove('idle'); clearTimeout(idleTimer); if (playing) idleTimer = setTimeout(() => player.classList.add('idle'), 2600); }
  function sbT(e) { const r = sb.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 1) * TL.total; }
  function tipAt(e) { const t = sbT(e), r = sb.getBoundingClientRect(); tip.style.left = clamp(e.clientX - r.left, 40, r.width - 40) + 'px'; tip.textContent = fmt(t) + '  ' + NAMES[sceneAt(t)]; }
  sb.addEventListener('pointerdown', e => { drag = true; sb.classList.add('drag'); sb.setPointerCapture(e.pointerId); const t = sbT(e); fl.style.width = th.style.left = (t / TL.total * 100) + '%'; seek(t); tipAt(e); });
  sb.addEventListener('pointermove', e => { tipAt(e); if (drag) { const t = sbT(e); fl.style.width = th.style.left = (t / TL.total * 100) + '%'; seek(t); } });
  sb.addEventListener('pointerup', () => { drag = false; sb.classList.remove('drag'); });
  sb.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { seek(T + 5); e.preventDefault(); } if (e.key === 'ArrowLeft') { seek(T - 5); e.preventDefault(); } });
  // ----- buttons -----
  const chapStep = d => { const i = sceneAt(T); const j = (d < 0 && T - SCENES[i].start > 2) ? i : clamp(i + d, 0, SCENES.length - 1); seek(SCENES[j].start + (j ? .9 : 0)); };
  bPlay.onclick = () => setPlaying(!playing);
  $('bPrev').onclick = () => chapStep(-1); $('bNext').onclick = () => chapStep(1);
  bSnd.onclick = () => { muted = !muted; ensureAudio(); applyVol(); };
  vol.oninput = () => { volume = vol.value / 100; muted = false; ensureAudio(); applyVol(); };
  function setCC(v) { ccOn = v; bCC.style.opacity = v ? 1 : .45; cap.textContent = v ? CAPS[Math.max(0, curScene)] : ''; }
  bCC.onclick = () => setCC(!ccOn);
  bSpd.onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; bSpd.firstChild.textContent = speed + 'x'; };
  function fs() { try { if (document.fullscreenElement) document.exitFullscreen(); else if (player.requestFullscreen) player.requestFullscreen(); } catch (e) { } }
  $('bFs').onclick = fs; if (!player.requestFullscreen) $('bFs').hidden = true;
  player.addEventListener('dblclick', e => { if (!e.target.closest('#ctl')) fs(); });
  player.addEventListener('click', e => { if (e.target.closest('#ctl')) return; setPlaying(!playing); });
  player.addEventListener('pointermove', poke);
  function seg(id, fn) { $(id).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; [...$(id).children].forEach(x => x.classList.toggle('on', x === b)); fn(b.dataset.v); }); }
  seg('sgMusic', v => { musicOn = v === '1'; }); seg('sgSfx', v => { sfxOn = v === '1'; });
  seg('sgQ', v => { scale = +v; sizeCanvas(); });
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input,button') && e.code === 'Space') return;
    const k = e.key.toLowerCase();
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    else if (k === 'arrowright') seek(T + 5); else if (k === 'arrowleft') seek(T - 5);
    else if (k === ']') chapStep(1); else if (k === '[') chapStep(-1);
    else if (k === 'm') { muted = !muted; ensureAudio(); applyVol(); } else if (k === 'c') setCC(!ccOn); else if (k === 'f') fs();
  });
  window.addEventListener('resize', () => { lastFrame = -1; });
  // ----- start -----
  sizeCanvas();
  const fontsDone = Promise.all([document.fonts.load("40px 'Caveat Brush'"), document.fonts.load("20px 'Patrick Hand'")]).catch(() => 0);
  Promise.race([fontsDone, new Promise(r => setTimeout(r, 2500))]).then(() => {
    ready = true; load.hidden = true; splash.hidden = false;
    const h = (location.hash || '').slice(1).toLowerCase(), hi = ['title', 'arrival', 'fit', 'field', 'gate', 'summer', 'prototype', 'weight', 'defense', 'treasure', 'handoff'].indexOf(h);
    seek(hi > 0 ? SCENES[hi].start + .9 : 0); requestAnimationFrame(loop); setCC(true);
  });
})();
</script>
